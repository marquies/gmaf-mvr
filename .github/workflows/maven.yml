# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  workflow_dispatch:
  push:
    branches: [ "master", "develop" ]
  pull_request:
    branches: [ "master", "develop" ]

permissions:
    contents: read
    checks: write
    id-token: write
    pull-requests: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml
    - name: JUnit Report Action
      uses: mikepenz/action-junit-report@v6.6.1
      with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          fail_on_failure: true
    - name: Code coverage summary
      if: always()
      run: |
        csv=target/site/jacoco/jacoco.csv
        if [ -f "$csv" ]; then
          awk -F"," 'NR>1 { missed+=$8; covered+=$9 } END {
            total=missed+covered;
            pct=(total>0)?100*covered/total:0;
            printf "## Code Coverage\n\nLine coverage: **%.2f%%** (%d/%d lines covered)\n", pct, covered, total
          }' "$csv" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "## Code Coverage\n\nNo jacoco.csv report found at $csv" >> "$GITHUB_STEP_SUMMARY"
        fi
    - name: Upload JaCoCo coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-coverage-report
        path: target/site/jacoco/
        if-no-files-found: warn
    - name: Report coverage on PR
      if: github.event_name == 'pull_request'
      uses: madrapps/jacoco-report@v1.6.1
      with:
        paths: ${{ github.workspace }}/target/site/jacoco/jacoco.xml
        token: ${{ secrets.GITHUB_TOKEN }}
        title: Unit Test Code Coverage
        min-coverage-overall: 0
        min-coverage-changed-files: 0
  publish-snapshot:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up settings.xml for GitHub Packages
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Publish SNAPSHOT version to GitHub Packages (we can skip tests since we only deploy if the build workflow succeeded)
        run: mvn -B --no-transfer-progress deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}


    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    #- name: Update dependency graph
    #  uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
