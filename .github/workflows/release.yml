name: Release

on:
  push:
    tags: [ "v[0-9]+.[0-9]+.[0-9]+" ]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up settings.xml for GitHub Packages
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set release version from tag
        run: mvn -B --no-transfer-progress versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      - name: Build, test and publish to GitHub Packages
        run: mvn -B --no-transfer-progress deploy
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" target/GMAF.jar --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
